{% if freshness %}
{% set s = freshness.ah_status %}
{% if s != "none" %}
<a href="/health" class="freshness-bar freshness-{{ s if s in ('fresh', 'today', 'stale', 'expired') else 'unknown' }}" title="打开健康数据管理">
    <span> Apple Health 数据</span>
    <span style="font-weight:600;">{{ freshness.ah_tag }}</span>
    {% if freshness.ah_overall_latest %}
    <span style="font-size:12px;">&#x2022; 更新至 {{ freshness.ah_overall_latest }}</span>
    {% endif %}
    <span class="freshness-action">查看/更新 →</span>
</a>
{% endif %}
{% elif not freshness %}
{% endif %}
