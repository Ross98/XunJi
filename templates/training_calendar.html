{% if cal %}
<div class="calendar-header">
    <button class="btn btn-nav" type="button" aria-label="上个月"
            {% if cal.can_prev %}data-calendar-url="/training/calendar/{{ cal.prev_year }}/{{ cal.prev_month }}"{% else %}disabled title="已到日期范围起点"{% endif %}>←</button>
    <span class="calendar-title">{{ cal.year }}年 {{ cal.month_name }}</span>
    <button class="btn btn-nav" type="button" aria-label="下个月"
            {% if cal.can_next %}data-calendar-url="/training/calendar/{{ cal.next_year }}/{{ cal.next_month }}"{% else %}disabled title="已到日期范围终点"{% endif %}>→</button>
</div>
<table class="calendar-grid">
    <thead><tr>
        <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th>
    </tr></thead>
    <tbody>
    {% for week in cal.weeks %}
        <tr>
        {% for d in week %}
            {% if d.day == 0 %}
            <td class="cal-empty"></td>
            {% else %}
            {% if d.has_data and not d.is_unfinished %}
            <td class="cal-day cal-has-data cal-load-{{ 3 if d.intensity >= 0.67 else 2 if d.intensity >= 0.34 else 1 }}{% if d.is_today %} cal-today{% endif %}"
            {% elif d.is_unfinished %}
            <td class="cal-day cal-has-data{% if d.is_today %} cal-today{% endif %}" title="仅未完成记录，不计训练统计"
            {% elif d.is_today %}
            <td class="cal-day cal-today"
            {% else %}
            <td class="cal-day"
            {% endif %}
                data-training-date="{{ d.date_str }}"
                role="button" tabindex="0" data-date="{{ d.date_str }}"
                aria-label="{{ d.date_str }}{% if d.is_unfinished %} 仅未完成记录{% elif d.has_data %} 有训练记录{% else %} 无训练记录{% endif %}">
                {{ d.day }}
            </td>
            {% endif %}
        {% endfor %}
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endif %}
